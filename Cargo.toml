[package]
name = "chronolens"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
kamadak-exif = "0.5"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
rayon = "1.10"
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
